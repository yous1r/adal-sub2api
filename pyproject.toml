[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sub2api"
version = "0.1.0"
description = "Wrap AI coding-agent subscriptions (AdaL, ...) behind one unified HTTP API with pluggable channels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anyio>=4.0",
    "httpx>=0.28.1",
    "openai>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "openai<=3.5"
]
# The AdaL Python SDK is installed separately from its Git repository:
#   pip install git+https://github.com/SylphAI-Inc/adal-sdk.git

[project.scripts]
sub2api = "sub2api.__main__:main"

[tool.setuptools.packages.find]
include = ["sub2api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
